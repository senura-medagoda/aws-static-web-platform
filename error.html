<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Senura Medagoda</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #3b82f6;
            line-height: 1;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .error-message {
            color: #cbd5e1;
            margin-bottom: 35px;
            line-height: 1.8;
        }

        .home-button {
            display: inline-block;
            padding: 14px 30px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .home-button:hover {
            background: #2563eb;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="error-container">

        <div class="error-code">
            404
        </div>

        <h1 class="error-title">
            Oops! Page Not Found
        </h1>

        <p class="error-message">
            The page you're looking for doesn't exist, may have been moved,
            or the URL may be incorrect.
            <br><br>
            Let's get you back to the portfolio.
        </p>

        <a href="index.html" class="home-button">
            Return Home
        </a>

    </div>

</body>
</html>
